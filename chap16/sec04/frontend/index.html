<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>도시 정책·문화 도우미</title>
  </head>
  <body class="min-h-screen bg-base-200">
    <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col gap-4 p-4 sm:p-6">
      <header class="flex flex-col gap-4 rounded-box border border-base-300 bg-base-100 px-5 py-4 shadow-sm sm:flex-row sm:items-center">
        <div>
          <h1 class="text-xl font-bold">도시 정책·문화 도우미</h1>
          <p class="text-xs text-base-content/60">LangGraph + FastAPI</p>
        </div>
        <div class="join sm:ml-auto" aria-label="대화 방식 선택">
          <input
            class="btn join-item btn-sm"
            type="radio"
            name="api-mode"
            value="chat"
            aria-label="일반 챗"
            checked
          />
          <input
            class="btn join-item btn-sm"
            type="radio"
            name="api-mode"
            value="chat_stream"
            aria-label="챗 스트리밍"
          />
          <input
            class="btn join-item btn-sm"
            type="radio"
            name="api-mode"
            value="rag"
            aria-label="RAG"
          />
          <input
            class="btn join-item btn-sm"
            type="radio"
            name="api-mode"
            value="rag_stream"
            aria-label="RAG 스트리밍"
          />
        </div>
      </header>

      <section
        id="messages"
        class="h-[65vh] overflow-y-auto rounded-box border border-base-300 bg-base-100 p-4 shadow-sm"
        aria-live="polite"
      >
        <div class="chat chat-start">
          <div class="chat-header mb-1 text-xs text-base-content/60">AI</div>
          <div class="chat-bubble bg-base-200 text-base-content">
            안녕하세요. 도시 정책이나 문화에 관해 질문해 보세요.
          </div>
        </div>
      </section>

      <form id="chat-form" class="join w-full shadow-sm">
        <input
          id="message-input"
          class="input join-item w-full border-base-300 bg-base-100"
          placeholder="메시지를 입력하세요."
          autocomplete="off"
        />
        <button class="btn btn-primary join-item" type="submit">보내기</button>
      </form>
      <p class="text-center text-xs text-base-content/50">
        AI의 답변에는 오류가 있을 수 있습니다.
      </p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
